# Build the conference-archive-search static site and deploy it to
# GitHub Pages (https://eliterature.github.io/archives/).
name: Deploy conference archive search to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "conference-archive-search/**"
      - "ELO-*-Web-Archive/**"
      - ".github/workflows/deploy-search.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: conference-archive-search/package-lock.json
      - name: Install dependencies
        working-directory: conference-archive-search
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: conference-archive-search
        run: npm run build
        env:
          BASE_PATH: /archives/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: conference-archive-search/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
