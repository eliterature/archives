    function preloadImages(imageUrls, callback) {
        let loaded = 0;
        const totalImages = imageUrls.length;
        imageUrls.forEach(url => {
            const img = new Image();
            img.onload = img.onerror = () => {
                loaded++;
                if (loaded === totalImages) {
                    callback();
                }
            };
            img.src = url;
        });
    }

    // Function to get a random element from an array
    function getRandomElement(array) {
        return array[Math.floor(Math.random() * array.length)];
    }

    // Function to generate random coordinates for the divs
    function getRandomCoordinates() {
        const imageContainer = document.getElementById('imageContainer');
        const containerRect = imageContainer.getBoundingClientRect(); // Get dimensions of the container
        const containerWidth = containerRect.width;
        const containerHeight = containerRect.height;
        const offsetX = containerWidth * 0.09; // 12.5% offset from each side
        const offsetY = containerHeight * 0.09;
        const usableWidth = containerWidth * 0.7; // 75% of container width
        const usableHeight = containerHeight - 2 * offsetY;

        // Loop until finding non-overlapping coordinates
        while (true) {
            const x = offsetX + Math.random() * usableWidth;
            const y = offsetY + Math.random() * usableHeight;
            const rect = { x, y, width: 250, height: 250 }; // Assuming each div is 100x100, adjust as needed

            // Check for collision with existing divs
            let overlapping = false;
            const divs = document.querySelectorAll('.randomDiv');
            for (const div of divs) {
                const divRect = div.getBoundingClientRect();
                if (rect.x < divRect.right && rect.x + rect.width > divRect.left &&
                    rect.y < divRect.bottom && rect.y + rect.height > divRect.top) {
                    overlapping = true;
                    break;
                }
            }

            // If no collision, return coordinates
            if (!overlapping) {
                return { x, y };
            }
        }
    }

    // Function to draw lines between random divs
    function drawLines() {
        const divs = document.querySelectorAll('.randomDiv');
        const lineContainer = document.getElementById('lineContainer');
        lineContainer.innerHTML = ''; // Clear previous lines
        divs.forEach((div1, index1) => {
            divs.forEach((div2, index2) => {
                if (index1 !== index2) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    const coordinates1 = getEdgeCoordinates(div1);
                    const coordinates2 = getEdgeCoordinates(div2);
                    line.setAttribute('x1', coordinates1.x);
                    line.setAttribute('y1', coordinates1.y);
                    line.setAttribute('x2', coordinates2.x);
                    line.setAttribute('y2', coordinates2.y);
                    line.setAttribute('stroke', 'white'); // Red color
                    line.setAttribute('stroke-width', '7'); // Thicker line
                    line.setAttribute('stroke-dasharray', '5,5'); // Dashed line
                    lineContainer.appendChild(line);
                }
            });
        });
    }

    // Function to draw random circles with random line widths
    function drawRandomCircles() {
        const circleContainer = document.getElementById('circleContainer');
        circleContainer.innerHTML = ''; // Clear previous circles
        const containerRect = circleContainer.getBoundingClientRect();
        const containerWidth = containerRect.width;
        const containerHeight = containerRect.height;

        for (let i = 0; i < 6; i++) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            const minRadius = 30;
            const maxRadius = containerWidth / 10; // Adjust the maximum radius as needed
            const radius = Math.random() * (maxRadius - minRadius) + minRadius; // Random radius within range
            const centerX = Math.random() * (containerWidth * 0.60) + (containerWidth * 0.225); // Within the middle 75% containerHeight
            const centerY = Math.random() * (containerHeight * 0.60) + (containerHeight * 0.225);
            circle.setAttribute('cx', centerX);
            circle.setAttribute('cy', centerY);
            circle.setAttribute('r', radius);
            circle.setAttribute('stroke', 'yellow');
            circle.setAttribute('fill', 'none'); // No fill
            // Set random stroke width within a range (e.g., between 3 and 8)
            const strokeWidth = Math.random() * (8 - 3) + 2;
            circle.setAttribute('stroke-width', strokeWidth);
            circleContainer.appendChild(circle);

            // Adding number to circle
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', centerX);
            text.setAttribute('y', centerY - radius + 35); // Adjust to position the number at the top of the circle
            text.setAttribute('class', 'circleText');
            text.textContent = i + 1;
            circleContainer.appendChild(text);
        }
    }

    // Function to get the edge coordinates of a div
    function getEdgeCoordinates(div) {
        const rect = div.getBoundingClientRect();
        const x = rect.left + rect.width / 4;
        const y = rect.top + rect.height / 4;
        return { x, y };
    }

// Function to play random beep sound with fade-in and fade-out
function playRandomBeep() {
    if (!window.beepPlaying) {
        window.beepPlaying = true;
        const audioContext = window.audioContext || new (window.AudioContext || window.webkitAudioContext)();
        window.audioContext = audioContext; // Store audio context globally for reuse
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(Math.random() * (1500 - 100) + 300, audioContext.currentTime); // Random frequency between 500Hz and 1500Hz

        // Apply fade-in
        gainNode.gain.setValueAtTime(0, audioContext.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.5, audioContext.currentTime + 0.05); // Adjust fade-in time as needed

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();

        // Apply fade-out after a random duration
        const duration = Math.random() * (300 - 100) + 100; // Random duration between 100ms and 300ms
        const endTime = audioContext.currentTime + duration / 1000; // Convert duration to seconds
        gainNode.gain.linearRampToValueAtTime(0, endTime); // Fade-out
        setTimeout(() => {
            oscillator.stop();
            window.beepPlaying = false;
        }, duration); // Stop oscillator after the duration
    }
}


    // Function to continuously play random beeps
    function playRandomBeepsInterval(interval) {
        setInterval(playRandomBeep, interval);
    }

    let intervalId;
    let beepIntervalId;

    // Function to handle auto-refresh
    function handleAutoRefresh() {
        intervalId = setInterval(() => {
             showPreloader(); // Show preloader
			setRandomImage();
            positionAndSetTextForDivs();
            drawLines();
            drawRandomCircles();
			setTimeout(hidePreloader, 500);
        }, 150); // Refresh interval set to 2 seconds

        // Start playing random beeps continuously
        playRandomBeepsInterval(1000000); // Change the interval (in milliseconds) as needed
    }

    // Function to pause or unpause auto-refresh
  function toggleAutoRefresh() {
        const button = document.getElementById('pauseButton');
        if (intervalId) {
            clearInterval(intervalId); // Pause auto-refresh
            clearInterval(beepIntervalId); // Pause continuous beeps
            intervalId = null;
            beepIntervalId = null;
            button.textContent = 'Unpause -> Unread';
        } else {
            handleAutoRefresh(); // Unpause auto-refresh
            button.textContent = 'Pause -> Read';
        }
    }

    // Call the setRandomImage, positionAndSetTextForDivs, drawLines, and drawRandomCircles functions when the page loads
  window.onload = function () {
        preloadImages(images, function () {
            hidePreloader(); // Hide the preloader once images are loaded
            handleAutoRefresh(); // Start auto-refresh after images are preloaded
        });
    };

    // Add event listener to the pause button
    document.getElementById('pauseButton').addEventListener('click', toggleAutoRefresh);
</script>
