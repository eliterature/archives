<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Shrine to Falling Microbes</title>
		<!--by Caitlin & Misha https://caitlinandmisha.com -->
		<!--Based on webgl_shaders_ocean.html THREEjs Example and custom 3d models, textures, and animation-->
		<!--Thank you very much to the THREEjs Community!-->

		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">

		<style>
			.lil-gui.autoPlace {
				display: none;
			}


			/* Loading screen https://jsfiddle.net/sojzu8a5/1/ */
			html, body {
				overflow: hidden;
				margin: 0;
				width: 100%;
				height: 100%;
			}

			#loading-screen {
				position: absolute;
				z-index: 2;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: #000000;
				opacity: 1;
			 	transition: 1s opacity;
			}

			#loading-screen.fade-out {
			    opacity: 0;
			}

			#loader {
			    display: block;
			    position: relative;
			    left: 50%;
			    top: 50%;
			    width: 150px;
			    height: 150px;
			    margin: -75px 0 0 -75px;
			    border-radius: 50%;
			    border: 3px solid transparent;
			    border-top-color: #2e4445;
			    -webkit-animation: spin 2s linear infinite;
			    animation: spin 2s linear infinite;
			}
			#loader:before {
			    content: "";
			    position: absolute;
			    top: 5px;
			    left: 5px;
			    right: 5px;
			    bottom: 5px;
			    border-radius: 50%;
			    border: 3px solid transparent;
			    border-top-color: #9a6e38;
			    -webkit-animation: spin 3s linear infinite;
			    animation: spin 3s linear infinite;
			}
			#loader:after {
			    content: "";
			    position: absolute;
			    top: 15px;
			    left: 15px;
			    right: 15px;
			    bottom: 15px;
			    border-radius: 50%;
			    border: 3px solid transparent;
			    border-top-color: #959e8b;
			    -webkit-animation: spin 1.5s linear infinite;
			    animation: spin 1.5s linear infinite;
			}
			@-webkit-keyframes spin {
			    0%   {
			        -webkit-transform: rotate(0deg);
			        -ms-transform: rotate(0deg);
			        transform: rotate(0deg);
			    }
			    100% {
			        -webkit-transform: rotate(360deg);
			        -ms-transform: rotate(360deg);
			        transform: rotate(360deg);
			    }
			}
			@keyframes spin {
			    0%   {
			        -webkit-transform: rotate(0deg);
			        -ms-transform: rotate(0deg);
			        transform: rotate(0deg);
			    }
			    100% {
			        -webkit-transform: rotate(360deg);
			        -ms-transform: rotate(360deg);
			        transform: rotate(360deg);
			    }
			}
		</style>
	</head>
	<body>

		<section id="loading-screen">
			<div id="loader"></div>
		</section>



		<div id="container"></div>
		<!--
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - webgl ocean
		</div>
	-->

		<!-- Import maps polyfill -->
		<!-- Remove this when import maps will be widely supported -->
		<script async src="./other-js/es-module-shims.js"></script>

		<script type="importmap">
			{
				"imports": {
					"three": "./build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Water } from 'three/addons/objects/Water.js';
			import { Sky } from 'three/addons/objects/Sky.js';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { TWEEN } from './other-js/tween.module.min.js';
			let container, stats;
			let camera, scene, renderer;
			let controls, water, sun, mesh;

			init();
			animate();

			function init() {

				container = document.getElementById( 'container' );

				//

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				container.appendChild( renderer.domElement );

				//

				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 55, window.innerWidth / window.innerHeight, 1, 20000 );
				camera.position.set( 30, 27, 100 );

				new TWEEN.Tween(camera)
					.to( { fov: 28 }, 40000)
					.yoyo(true)
					//.repeat(Infinity)
					.repeat(3)
					.easing(TWEEN.Easing.Cubic.InOut)
					.onUpdate(()=>camera.updateProjectionMatrix())
					.start()
				;

				//

				sun = new THREE.Vector3();

				// Water

				const waterGeometry = new THREE.PlaneGeometry( 10000, 10000 );

				water = new Water(
					waterGeometry,
					{
						textureWidth: 512,
						textureHeight: 512,
						waterNormals: new THREE.TextureLoader().load( 'textures/waternormals.jpg', function ( texture ) {

							texture.wrapS = texture.wrapT = THREE.RepeatWrapping;

						} ),
						sunDirection: new THREE.Vector3(),
						sunColor: 0xF1C40F,
						waterColor: 0x07393c,
						distortionScale: 1.2,
						fog: scene.fog !== undefined
					}
				);

				water.rotation.x = - Math.PI / 2;

				scene.add( water );

				// Skybox


				const sky = new Sky();
				sky.scale.setScalar( 10000 );
				//scene.add( sky );

				//halo around shrine
				const color = 0x090909;
  			var near = 18800;
  			var far = 19500;
  			//scene.fog = new THREE.Fog(color, near, far);

				//this fog doesn't work
				/*
				const color = 0x111111;
  			const density = 0.000055;
  			scene.fog = new THREE.FogExp2(color, density);
				*/



				var skyGeo = new THREE.SphereGeometry(20000, 30, 30, 3.14/2 + .3);
				var loader  = new THREE.TextureLoader();
				loader.load("textures/starmap9.png",

					// onLoad callback
					function ( texture ) {
						// in this example we create the material when the texture is loaded
						const material2 = new THREE.MeshBasicMaterial( {
							map: texture
						 } );
						 var sky2 = new THREE.Mesh(skyGeo, material2);
						 sky2.material.side = THREE.BackSide;
						 sky2.rot
						 scene.add(sky2);
					},

					// onProgress callback currently not supported
					undefined,

					// onError callback
					function ( err ) {
						console.error( 'An error happened.' );
					}

				);


				// model

				const model_loader = new GLTFLoader().setPath( 'models/gltf/' );
				model_loader.load( 'shrine_b-longum6.glb', function ( gltf ) {

					scene.add( gltf.scene );

					//loading screen
					const loadingScreen = document.getElementById( 'loading-screen' );
					loadingScreen.classList.add( 'fade-out' );

					// optional: remove loader from DOM via event listener
					loadingScreen.addEventListener( 'transitionend', onTransitionEnd );

					function onTransitionEnd( event ) {

						event.target.remove();

					}

					render();

				} );


				const skyUniforms = sky.material.uniforms;

				skyUniforms[ 'turbidity' ].value = 10;
				skyUniforms[ 'rayleigh' ].value = 4;
				skyUniforms[ 'mieCoefficient' ].value = 0.005;
				skyUniforms[ 'mieDirectionalG' ].value = 0.8;

				const parameters = {
					elevation: 12,//17,
					azimuth: 3//-1.4
				};

				const pmremGenerator = new THREE.PMREMGenerator( renderer );
				let renderTarget;

				function updateSun() {

					const phi = THREE.MathUtils.degToRad( 90 - parameters.elevation );
					const theta = THREE.MathUtils.degToRad( parameters.azimuth );

					sun.setFromSphericalCoords( 1, phi, theta );

					sky.material.uniforms[ 'sunPosition' ].value.copy( sun );
					water.material.uniforms[ 'sunDirection' ].value.copy( sun ).normalize();

					if ( renderTarget !== undefined ) renderTarget.dispose();

					renderTarget = pmremGenerator.fromScene( sky );

					scene.environment = renderTarget.texture;

				}

				updateSun();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.maxPolarAngle = Math.PI * 0.495;
				controls.target.set( 0, 10, 0 );
				controls.minDistance = 40.0;
				controls.maxDistance = 200.0;
				controls.update();
				controls.autoRotate = true;
				controls.autoRotateSpeed = .5;
				controls.addEventListener( 'change', render );
				//

				stats = new Stats();
				//container.appendChild( stats.dom );

				// GUI

				const gui = new GUI();

				const folderSky = gui.addFolder( 'Sky' );
				folderSky.add( parameters, 'elevation', 0, 90, 0.1 ).onChange( updateSun );
				folderSky.add( parameters, 'azimuth', - 180, 180, 0.1 ).onChange( updateSun );
				folderSky.open();

				const waterUniforms = water.material.uniforms;

				const folderWater = gui.addFolder( 'Water' );
				folderWater.add( waterUniforms.distortionScale, 'value', 0, 8, 0.1 ).name( 'distortionScale' );
				folderWater.add( waterUniforms.size, 'value', 0.1, 10, 0.1 ).name( 'size' ).setValue(10);
				folderWater.open();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				requestAnimationFrame( animate );
				render();
				stats.update();

				controls.update();

				TWEEN.update();

			}

			function render() {

				const time = performance.now() * 0.001;

				water.material.uniforms[ 'time' ].value += 1.0 / 60.0;

				renderer.toneMappingExposure = 0.65;
				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
