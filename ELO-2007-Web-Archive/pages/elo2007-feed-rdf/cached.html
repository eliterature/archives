<item rdf:about="http://localhost:8888/elo2007/archives/20">
	<title>Concluded</title>
	<link>http://localhost:8888/elo2007/archives/20</link>
	 <dc:date>2007-05-05T18:42:49Z</dc:date>
	<dc:creator>mgk</dc:creator>
	
		<dc:subject><![CDATA[Aftermath]]></dc:subject>
	<description>It's all over, look for a more detailed write-up (and lots of photos) soon. In the meantime, I just wanted to leave a public record of appreciation for everyone who worked to help make the event so successful, especially helen DeVinney, Cindy Woo, Greg Lord, Doug Reside, Neil Fraistat, James ...</description>
	<content:encoded><![CDATA[<p>It&#8217;s all over, look for a more detailed write-up (and lots of photos) soon. In the meantime, I just wanted to leave a public record of appreciation for everyone who worked to help make the event so successful, especially helen DeVinney, Cindy Woo, Greg Lord, Doug Reside, Neil Fraistat, James Chagetas, and Tricia Ready. Thanks also to Walter Woo, Emily Adamo, and Jason DeVinney.</p>
<p>My deep gratitude and appreciation as well to all of the speakers and attendees for making the trip, some of them from very far away indeed. From my perspective it was an extremely rewarding event to be a part of, and I hope that others feel the same.</p>
<p>Again, watch this space for follow-up . . .</p>
<p>MGK</p>
]]></content:encoded>
	</item>

<item rdf:about="http://localhost:8888/elo2007/archives/17">
	<title>Sign-Up for Open Mic/Mouse</title>
	<link>http://localhost:8888/elo2007/archives/17</link>
	 <dc:date>2007-04-18T15:36:55Z</dc:date>
	<dc:creator>mgk</dc:creator>
	
		<dc:subject><![CDATA[Breaking News]]></dc:subject>
	<description>The Open Mic/Mouse on the evening of Wednesday, May2, is free and open to all. Everyone is welcome to take a turn at the mic and mouse--the only requirement is that you conceive of your work as "electronic literature" in some form.

Technology in the room will be a Windows machine, ...</description>
	<content:encoded><![CDATA[<p>The Open Mic/Mouse on the evening of Wednesday, May2, is free and open to all. Everyone is welcome to take a turn at the mic and mouse&#8211;the only requirement is that you conceive of your work as &#8220;electronic literature&#8221; in some form.</p>
<p>Technology in the room will be a Windows machine, with accompanying projection and sound capabilities (and an internet connection).</p>
<p>We have no control over the software installaion, but you can assume a current generation Web browser, probably Firefox. You cannot necessarily assume the presence of particular plug-ins.</p>
<p>An altnerative will be to swap your own laptop into the room&#8217;s projection system. Doing that is easier for works without sound than those with sound (which require a separate set of cables to connect to the sound system in the room).  It should be possible to plug USB memory sticks into the computer in the room.</p>
<p>  Bottom line is please plan some flexibility into presentation options. Don&#8217;t assume you will be able to show a piece that demands minute particulars in terms of its technical environment. We&#8217;ll do our best, but it&#8217;s not our room, it&#8217;s not our tech, and we can&#8217;t promise .</p>
<p>Please sign-up in the Comments, below, so we have a working list of authors.</p>
]]></content:encoded>
	</item>

		</span><div class="folder" id="folder27"><div class="line"><span class="folder-button fold"></span><span class="html-tag">&lt;dc:subject&gt;</span></div><div class="opened"><div class="line"><span>&lt;![CDATA[ Breaking News ]]&gt;</span></div></div><span class="folded hidden">...</span><div class="line"><span class="html-tag">&lt;/dc:subject&gt;</span></div></div><span>
	</span><div class="line"><span class="html-tag">&lt;description&gt;</span><span>The Open Mic/Mouse on the evening of Wednesday, May2, is free and open to all. Everyone is welcome to take a turn at the mic and mouse--the only requirement is that you conceive of your work as "electronic literature" in some form.

Technology in the room will be a Windows machine, ...</span><span class="html-tag">&lt;/description&gt;</span></div><span>
	</span><div class="folder" id="folder28"><div class="line"><span class="folder-button fold"></span><span class="html-tag">&lt;content:encoded&gt;</span></div><div class="opened"><div class="line"><span>&lt;![CDATA[ &lt;p&gt;The Open Mic/Mouse on the evening of Wednesday, May2, is free and open to all. Everyone is welcome to take a turn at the mic and mouse&amp;#8211;the only requirement is that you conceive of your work as &amp;#8220;electronic literature&amp;#8221; in some form.&lt;/p&gt;
&lt;p&gt;Technology in the room will be a Windows machine, with accompanying projection and sound capabilities (and an internet connection).&lt;/p&gt;
&lt;p&gt;We have no control over the software installaion, but you can assume a current generation Web browser, probably Firefox. You cannot necessarily assume the presence of particular plug-ins.&lt;/p&gt;
&lt;p&gt;An altnerative will be to swap your own laptop into the room&amp;#8217;s projection system. Doing that is easier for works without sound than those with sound (which require a separate set of cables to connect to the sound system in the room).  It should be possible to plug USB memory sticks into the computer in the room.&lt;/p&gt;
&lt;p&gt;  Bottom line is please plan some flexibility into presentation options. Don&amp;#8217;t assume you will be able to show a piece that demands minute particulars in terms of its technical environment. We&amp;#8217;ll do our best, but it&amp;#8217;s not our room, it&amp;#8217;s not our tech, and we can&amp;#8217;t promise .&lt;/p&gt;
&lt;p&gt;Please sign-up in the Comments, below, so we have a working list of authors.&lt;/p&gt;
 ]]&gt;</span></div></div><span class="folded hidden">...</span><div class="line"><span class="html-tag">&lt;/content:encoded&gt;</span></div></div><span>
